name: MediaSimilarityFinder 0.9.2.63 - Windows CPU

on:
  workflow_dispatch:

jobs:
  windows-cpu:
    name: Windows x64 CPU / VS2026 / Qt6
    runs-on: windows-2025-vs2026

    env:
      BUILD_TYPE: Release
      VCPKG_DEFAULT_TRIPLET: x64-windows
      VCPKG_FEATURE_FLAGS: manifests,binarycaching

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Show toolchain
        shell: pwsh
        run: |
          cmake --version
          git --version
          $vcpkg = Get-Command vcpkg.exe -ErrorAction Stop
          $vcpkgRoot = Split-Path $vcpkg.Source -Parent
          "VCPKG_ROOT=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Append
          & $vcpkg.Source version
          & "\${env:ProgramFiles}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath

      - name: Build and test
        working-directory: src_unpacked
        shell: pwsh
        run: |
          .\scripts\build_windows_cpu.ps1 -VcpkgRoot $env:VCPKG_ROOT

      - name: Verify GUI executable
        working-directory: src_unpacked
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'build-windows-cpu\Release\MediaSimilarityFinder.exe'
          if (-not (Test-Path $exe)) { throw "GUI executable not found: $exe" }
          & $exe --version
          if ($LASTEXITCODE -ne 0) { throw "MediaSimilarityFinder --version failed: $LASTEXITCODE" }
          & $exe --smoke
          if ($LASTEXITCODE -ne 0) { throw "MediaSimilarityFinder --smoke failed: $LASTEXITCODE" }
