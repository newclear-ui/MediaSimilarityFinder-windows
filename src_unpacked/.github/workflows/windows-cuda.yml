name: Windows CUDA build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v0.9.2.*'
  pull_request:

jobs:
  build-cuda:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Locate CUDA Toolkit
        shell: pwsh
        run: |
          $nvcc = Get-Command nvcc -ErrorAction SilentlyContinue
          if (-not $nvcc) { throw 'nvcc was not found on the Windows runner' }
          nvcc --version

      - name: Install vcpkg dependencies
        shell: pwsh
        run: |
          if (-not $env:VCPKG_ROOT) { throw 'VCPKG_ROOT is not set' }
          & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet x64-windows

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            -DMSF_ENABLE_CUDA=ON `
            -DMSF_ENABLE_FFMPEG=ON `
            -DMSF_BUILD_GUI=ON `
            -DMSF_BUILD_TESTS=ON `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake"

      - name: Build Release
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Run tests
        shell: pwsh
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Verify CUDA test was built
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'build\tests\Release\msf_cuda_backend_test.exe'
          if (-not (Test-Path $exe)) {
            $exe = Join-Path $PWD 'build\Release\msf_cuda_backend_test.exe'
          }
          if (-not (Test-Path $exe)) { throw 'CUDA regression executable was not produced' }
          & $exe
          if ($LASTEXITCODE -ne 0) { throw "CUDA regression test failed: $LASTEXITCODE" }

      - name: Verify GUI
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'build\Release\MediaSimilarityFinder.exe'
          if (-not (Test-Path $exe)) { throw 'GUI executable was not produced' }
          & $exe --version

      - name: Deploy Qt runtime
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'build\Release\MediaSimilarityFinder.exe'
          $windeploy = Get-ChildItem "$env:VCPKG_ROOT\installed\x64-windows\tools" -Filter windeployqt.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $windeploy) { throw 'windeployqt.exe was not found' }
          & $windeploy.FullName $exe --release --no-translations

      - name: Collect MSVC runtime
        shell: pwsh
        run: |
          $stage = Join-Path $PWD 'package'
          New-Item -ItemType Directory -Force $stage | Out-Null
          $vcCandidates = @(
            (Get-Command vcruntime140.dll -ErrorAction SilentlyContinue).Source,
            (Get-Command vcruntime140_1.dll -ErrorAction SilentlyContinue).Source,
            (Get-Command msvcp140.dll -ErrorAction SilentlyContinue).Source
          ) | Where-Object { $_ }
          foreach ($src in $vcCandidates) { Copy-Item $src $stage -Force }

      - name: Package CUDA runtime
        shell: pwsh
        run: |
          $stage = Join-Path $PWD 'package'
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item 'build\Release\MediaSimilarityFinder.exe' $stage
          Copy-Item 'build\Release\*.dll' $stage -ErrorAction SilentlyContinue
          Copy-Item "$env:VCPKG_ROOT\installed\x64-windows\bin\*.dll" $stage -ErrorAction SilentlyContinue
          $cudart = Get-Command nvcc | Select-Object -ExpandProperty Source
          $cudaBin = Split-Path $cudart
          Get-ChildItem $cudaBin -Filter 'cudart64*.dll' -ErrorAction SilentlyContinue | Copy-Item -Destination $stage
          Copy-Item 'README_CUDA_0.9.2.10.md' $stage
          Copy-Item 'README.md' $stage
          if (Test-Path 'LICENSE') { Copy-Item 'LICENSE' $stage }
          Compress-Archive -Path "$stage\*" -DestinationPath 'MediaSimilarityFinder-v0.9.2.10-CUDA-Windows-x64.zip' -Force

      - uses: actions/upload-artifact@v7
        with:
          name: MediaSimilarityFinder-v0.9.2.10-CUDA-Windows-x64
          path: MediaSimilarityFinder-v0.9.2.10-CUDA-Windows-x64.zip
