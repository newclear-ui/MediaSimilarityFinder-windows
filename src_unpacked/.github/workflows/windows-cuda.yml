name: MediaSimilarityFinder 0.9.2.63 - Windows CUDA

on:
  workflow_dispatch:

jobs:
  windows-cuda:
    name: Windows x64 CUDA / VS2026
    runs-on: windows-2025-vs2026

    env:
      VCPKG_DEFAULT_TRIPLET: x64-windows
      VCPKG_FEATURE_FLAGS: manifests,binarycaching

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Show toolchain and CUDA
        shell: pwsh
        run: |
          cmake --version
          git --version
          $vcpkg = Get-Command vcpkg.exe -ErrorAction Stop
          $vcpkgRoot = Split-Path $vcpkg.Source -Parent
          "VCPKG_ROOT=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Append
          & $vcpkg.Source version
          $nvcc = Get-Command nvcc.exe -ErrorAction SilentlyContinue
          if (-not $nvcc) { throw 'nvcc.exe was not found on the hosted runner.' }
          & $nvcc.Source --version
          & "${env:ProgramFiles}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath

      - name: Build and test
        working-directory: src_unpacked
        shell: pwsh
        run: |
          .\scripts\build_windows_cuda.ps1 -VcpkgRoot $env:VCPKG_ROOT

      - name: Report GPU availability
        shell: pwsh
        run: |
          $nvidia = Get-Command nvidia-smi.exe -ErrorAction SilentlyContinue
          if ($nvidia) {
            & $nvidia.Source -L
            if ($LASTEXITCODE -eq 0) {
              "A hosted NVIDIA GPU is available to this job."
            } else {
              "No hosted NVIDIA GPU is available; CUDA runtime test paths may self-skip."
            }
          } else {
            "nvidia-smi.exe is not present; this workflow validates CUDA compilation and device-independent tests only."
          }

      - name: Verify GUI executable
        working-directory: src_unpacked
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'build-windows-cuda\Release\MediaSimilarityFinder.exe'
          if (-not (Test-Path $exe)) { throw "GUI executable not found: $exe" }
          & $exe --version
          if ($LASTEXITCODE -ne 0) { throw "MediaSimilarityFinder --version failed: $LASTEXITCODE" }
          & $exe --smoke
          if ($LASTEXITCODE -ne 0) { throw "MediaSimilarityFinder --smoke failed: $LASTEXITCODE" }

      - name: Upload CUDA build artifact
        uses: actions/upload-artifact@v7
        with:
          name: MediaSimilarityFinder-v0.9.2.63-CUDA-build
          path: src_unpacked/build-windows-cuda/Release/MediaSimilarityFinder.exe
          if-no-files-found: error
          retention-days: 14
