name: MediaSimilarityFinder - Windows CUDA

on:
  workflow_dispatch:

jobs:
  windows-cuda:
    name: Windows x64 CUDA / VS2026
    runs-on: windows-2025-vs2026

    env:
      VCPKG_DEFAULT_TRIPLET: x64-windows
      VCPKG_FEATURE_FLAGS: manifests,binarycaching
      # Release-only dependency builds are enforced by src_unpacked/triplets/x64-windows.cmake.
      # (The VCPKG_BUILD_TYPE environment variable is ignored in manifest mode.)
      # vcpkg binary cache: compiled dependency archives are reused across runs.
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/vcpkg-cache,readwrite"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Cache vcpkg binary packages
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg-cache
          key: vcpkg-v3-${{ runner.os }}-x64-windows-${{ hashFiles('src_unpacked/vcpkg.json') }}
          restore-keys: |
            vcpkg-v3-${{ runner.os }}-x64-windows-

      # Hosted windows-2025-vs2026 ships without CUDA. Install the toolkit once and
      # cache the install directory; later runs restore it instead of reinstalling.
      - name: Cache CUDA toolkit
        id: cuda-cache
        uses: actions/cache@v4
        with:
          path: C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v13.2
          key: cuda-13.2-windows

      - name: Install CUDA toolkit
        if: steps.cuda-cache.outputs.cache-hit != 'true'
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: '13.2.0'
          method: 'network'
          sub-packages: '["nvcc", "visual_studio_integration"]'

      - name: Restore CUDA environment from cache
        if: steps.cuda-cache.outputs.cache-hit == 'true'
        shell: pwsh
        run: |
          $cuda = 'C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v13.2'
          if (-not (Test-Path (Join-Path $cuda 'bin\nvcc.exe'))) { throw "cached CUDA is incomplete: $cuda" }
          "CUDA_PATH=$cuda" | Out-File -FilePath $env:GITHUB_ENV -Append
          (Join-Path $cuda 'bin') | Out-File -FilePath $env:GITHUB_PATH -Append
          & (Join-Path $cuda 'bin\nvcc.exe') --version

      - name: Show toolchain and CUDA
        shell: pwsh
        run: |
          cmake --version
          git --version
          $vcpkg = Get-Command vcpkg.exe -ErrorAction Stop
          $vcpkgRoot = Split-Path $vcpkg.Source -Parent
          "VCPKG_ROOT=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Append
          & $vcpkg.Source version
          $nvcc = Get-Command nvcc.exe -ErrorAction SilentlyContinue
          if (-not $nvcc -and $env:CUDA_PATH) {
            $candidate = Join-Path $env:CUDA_PATH 'bin\nvcc.exe'
            if (Test-Path $candidate) {
              $env:PATH = (Join-Path $env:CUDA_PATH 'bin') + ';' + $env:PATH
              $nvcc = Get-Command nvcc.exe -ErrorAction SilentlyContinue
            }
          }
          if (-not $nvcc) { throw 'nvcc.exe was not found on the hosted runner.' }
          & $nvcc.Source --version
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path $vswhere)) { $vswhere = Join-Path $env:ProgramFiles 'Microsoft Visual Studio\Installer\vswhere.exe' }
          if (Test-Path $vswhere) {
            & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          } else {
            Write-Host 'vswhere.exe not found; relying on CMake generator detection'
          }

      - name: Build and test
        working-directory: src_unpacked
        shell: pwsh
        run: |
          .\scripts\build_windows_cuda.ps1 -VcpkgRoot $env:VCPKG_ROOT -CTestExclude 'reveal_window_test|image_dim_test|video_reencode_test|video_scan_e2e_test'

      - name: Report GPU availability
        shell: pwsh
        run: |
          $nvidia = Get-Command nvidia-smi.exe -ErrorAction SilentlyContinue
          if ($nvidia) {
            & $nvidia.Source -L
            if ($LASTEXITCODE -eq 0) {
              "A hosted NVIDIA GPU is available to this job."
            } else {
              "No hosted NVIDIA GPU is available; CUDA runtime test paths may self-skip."
            }
          } else {
            "nvidia-smi.exe is not present; this workflow validates CUDA compilation and device-independent tests only."
          }

      - name: Verify GUI executable
        working-directory: src_unpacked
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'build-windows-cuda\Release\MediaSimilarityFinder.exe'
          if (-not (Test-Path $exe)) { throw "GUI executable not found: $exe" }
          # GUI-subsystem exe: PowerShell does not set $LASTEXITCODE, so use Start-Process.
          # --smoke is the headless hook and expects the offscreen Qt platform.
          $env:QT_QPA_PLATFORM = 'offscreen'
          $v = Start-Process -FilePath $exe -ArgumentList '--version' -Wait -PassThru
          if ($v.ExitCode -ne 0) { throw "MediaSimilarityFinder --version failed: $($v.ExitCode)" }
          $s = Start-Process -FilePath $exe -ArgumentList '--smoke' -Wait -PassThru
          if ($s.ExitCode -ne 0) { throw "MediaSimilarityFinder --smoke failed: $($s.ExitCode)" }

      - name: Upload CUDA build artifact
        uses: actions/upload-artifact@v7
        with:
          name: MediaSimilarityFinder-v0.9.2.63-CUDA-build
          path: src_unpacked/build-windows-cuda/Release/MediaSimilarityFinder.exe
          if-no-files-found: error
          retention-days: 14
