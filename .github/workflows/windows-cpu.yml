name: MediaSimilarityFinder - Windows CPU

on:
  workflow_dispatch:

jobs:
  windows-cpu:
    name: Windows x64 CPU / VS2026 / Qt6
    runs-on: windows-2025-vs2026

    env:
      BUILD_TYPE: Release
      VCPKG_DEFAULT_TRIPLET: x64-windows
      VCPKG_FEATURE_FLAGS: manifests,binarycaching
      # The product only builds Release. Skipping Debug halves vcpkg work and avoids
      # Debug-only port failures (e.g. dav1d on the floating runner registry).
      VCPKG_BUILD_TYPE: release
      # vcpkg binary cache: compiled dependency archives are reused across runs.
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/vcpkg-cache,readwrite"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Cache vcpkg binary packages
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg-cache
          key: vcpkg-v2-${{ runner.os }}-x64-windows-${{ hashFiles('src_unpacked/vcpkg.json') }}
          restore-keys: |
            vcpkg-v2-${{ runner.os }}-x64-windows-

      - name: Show toolchain
        shell: pwsh
        run: |
          cmake --version
          git --version
          $vcpkg = Get-Command vcpkg.exe -ErrorAction Stop
          $vcpkgRoot = Split-Path $vcpkg.Source -Parent
          "VCPKG_ROOT=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Append
          & $vcpkg.Source version
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path $vswhere)) { $vswhere = Join-Path $env:ProgramFiles 'Microsoft Visual Studio\Installer\vswhere.exe' }
          if (Test-Path $vswhere) {
            & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          } else {
            Write-Host 'vswhere.exe not found; relying on CMake generator detection'
          }

      - name: Build and test
        working-directory: src_unpacked
        shell: pwsh
        run: |
          # vcpkg ffmpeg is built with --disable-libx264 and --disable-zlib, so tests that
          # generate H.264 (libx264) or PNG fixtures cannot run here. reveal_window_test
          # needs an interactive Explorer desktop. All four pass locally where a full
          # ffmpeg is on PATH; making them capability-aware is a follow-up test-hardening task.
          .\scripts\build_windows_cpu.ps1 -VcpkgRoot $env:VCPKG_ROOT -CTestExclude 'reveal_window_test|image_dim_test|video_reencode_test|video_scan_e2e_test'

      - name: Verify GUI executable
        working-directory: src_unpacked
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'build-windows-cpu\Release\MediaSimilarityFinder.exe'
          if (-not (Test-Path $exe)) { throw "GUI executable not found: $exe" }
          # GUI-subsystem exe: PowerShell does not set $LASTEXITCODE, so use Start-Process.
          # --smoke is the headless hook and expects the offscreen Qt platform.
          $env:QT_QPA_PLATFORM = 'offscreen'
          $v = Start-Process -FilePath $exe -ArgumentList '--version' -Wait -PassThru
          if ($v.ExitCode -ne 0) { throw "MediaSimilarityFinder --version failed: $($v.ExitCode)" }
          $s = Start-Process -FilePath $exe -ArgumentList '--smoke' -Wait -PassThru
          if ($s.ExitCode -ne 0) { throw "MediaSimilarityFinder --smoke failed: $($s.ExitCode)" }
